name: Draft release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  draft:
    name: Build and create draft release
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Axolotl-PM PHP
        uses: axolotl-pm/setup-php-action@1.0.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: '5'

      - name: Build virion with DevTools
        id: build
        uses: AxolotlBucketLabs/DevTools@v4.1.2
        with:
          type: virion
          project: .
          output: build

      - name: Verify and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA256: ${{ steps.build.outputs.sha256 }}
          RELEASE_PHAR: ${{ steps.build.outputs.phar }}
          RELEASE_NAME: ${{ steps.build.outputs.artifact-name }}
          RELEASE_API: '5.0.0'
        shell: bash
        run: |
          set -euo pipefail

          test -f "$RELEASE_PHAR"
          printf '%s  %s\n' "$RELEASE_SHA256" "$RELEASE_PHAR" | sha256sum --check

          checksum_file="$RUNNER_TEMP/SHA256SUMS.txt"
          printf '%s  %s\n' "$RELEASE_SHA256" "$(basename "$RELEASE_PHAR")" > "$checksum_file"

          release_flags=(--verify-tag --draft --title "$RELEASE_NAME ${RELEASE_TAG}" --notes "For Axolotl-PM API ${RELEASE_API}.")
          if [[ "$RELEASE_TAG" =~ (alpha|beta|pre) ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "$RELEASE_PHAR" "$checksum_file" "${release_flags[@]}"
