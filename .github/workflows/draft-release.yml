name: Draft release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    name: Build virion PHAR with DevTools 4.1.2
    if: startsWith(github.event.head_commit.message, 'Release ')
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-virion.yml@v4.1.2
    with:
      project: .
      php-version: '8.4'

  draft:
    name: Create GitHub draft release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download the built virion
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true

      - name: Verify and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
          RELEASE_API: '5.0.0'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t phars < <(find release -type f -name '*.phar' -print)
          if (( ${#phars[@]} != 1 )); then
            echo "Expected one virion PHAR, found ${#phars[@]}" >&2
            exit 1
          fi

          phar="${phars[0]}"
          printf '%s  %s\n' "$RELEASE_SHA256" "$phar" | sha256sum --check

          checksum_file="release/SHA256SUMS.txt"
          printf '%s  %s\n' "$RELEASE_SHA256" "$(basename "$phar")" > "$checksum_file"

          release_flags=(--verify-tag --draft --title "libpmcurl v${RELEASE_TAG}" --notes "For Axolotl-PM API ${RELEASE_API}.")
          if [[ "$RELEASE_TAG" =~ (alpha|beta|pre) ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "$phar" "$checksum_file" "${release_flags[@]}"
