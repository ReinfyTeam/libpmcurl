name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Axolotl-PM PHP
        uses: axolotl-pm/setup-php-action@1.0.0
        with:
          php-version: ${{ matrix.php }}
          install-path: ./bin
          pm-version-major: '5'

      - name: Restore Composer package cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer/files
            ~/.cache/composer/vcs
          key: composer-v2-cache-${{ matrix.php }}-${{ hashFiles('./composer.lock') }}
          restore-keys: composer-v2-cache-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan at maximum level
        run: ./vendor/bin/phpstan analyze --no-progress --memory-limit=2G

  codestyle:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP and PHP-CS-Fixer
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          tools: php-cs-fixer:3.95
          coverage: none

      - name: Check code style
        run: php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.php

  devtools:
    name: Build virion with DevTools 4.1.2
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-virion.yml@v4.1.2
    with:
      project: .
      php-version: '8.4'
