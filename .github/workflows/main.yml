name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  PHPStan_Analyze:
    name: PHPStan Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP for PocketMine-MP
        uses: pmmp/setup-php-action@e031917a35223b96cba12fe19ace0765c91f6bfb
        with:
          php-version: '8.4'
          pm-version-major: 5

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --ignore-platform-req=ext-webrtc

      - name: Run PhpStan
        run: phpstan analyze --no-progress src -c phpstan.neon.dist

  codestyle:
    name: Code Style checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP for PocketMine-MP
        uses: pmmp/setup-php-action@e031917a35223b96cba12fe19ace0765c91f6bfb
        with:
          php-version: '8.4'
          pm-version-major: 5
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --ignore-platform-req=ext-webrtc

      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.php